apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: science-ai-mlops
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: mlflow-functional-demo
    science-ai.io/managed-by: mini-science-ai-os
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: science-ai-mlops
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: mlflow-functional-demo
    science-ai.io/managed-by: mini-science-ai-os
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: science-ai-mlops
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: mlflow-functional-demo
    science-ai.io/managed-by: mini-science-ai-os
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: mlflow-functional-demo
        science-ai.io/managed-by: mini-science-ai-os
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.13.0
          imagePullPolicy: IfNotPresent
          args:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --workers
            - "1"
            - --backend-store-uri
            - sqlite:////mlflow/mlflow.db
            - --artifacts-destination
            - /mlflow/artifacts
            - --allowed-hosts
            - mlflow,mlflow:5000,mlflow.science-ai-mlops,mlflow.science-ai-mlops:5000,mlflow.science-ai-mlops.svc,mlflow.science-ai-mlops.svc:5000,mlflow.science-ai-mlops.svc.cluster.local,mlflow.science-ai-mlops.svc.cluster.local:5000,mlflow.192.168.0.56.nip.io,mlflow.10.254.192.217.nip.io,localhost,127.0.0.1
            - --cors-allowed-origins
            - http://mlflow.192.168.0.56.nip.io,http://mlflow.10.254.192.217.nip.io
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /mlflow
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
