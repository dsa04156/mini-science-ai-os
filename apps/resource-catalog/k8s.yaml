apiVersion: v1
kind: ServiceAccount
metadata:
  name: resource-catalog
  namespace: science-ai-system
  labels:
    science-ai.io/managed-by: mini-science-ai-os
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mini-science-ai-os-resource-catalog
  labels:
    science-ai.io/managed-by: mini-science-ai-os
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads", "clusterqueues", "localqueues", "resourceflavors"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mini-science-ai-os-resource-catalog
  labels:
    science-ai.io/managed-by: mini-science-ai-os
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mini-science-ai-os-resource-catalog
subjects:
  - kind: ServiceAccount
    name: resource-catalog
    namespace: science-ai-system
---
apiVersion: v1
kind: Service
metadata:
  name: resource-catalog
  namespace: science-ai-system
  labels:
    app.kubernetes.io/name: resource-catalog
    science-ai.io/managed-by: mini-science-ai-os
spec:
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app.kubernetes.io/name: resource-catalog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-catalog
  namespace: science-ai-system
  labels:
    app.kubernetes.io/name: resource-catalog
    science-ai.io/managed-by: mini-science-ai-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resource-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resource-catalog
        science-ai.io/managed-by: mini-science-ai-os
    spec:
      serviceAccountName: resource-catalog
      automountServiceAccountToken: true
      nodeSelector:
        environment: cloud
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: resource-catalog
          image: 192.168.0.56:5000/mini-science-ai-os:0.3.1
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "science_os.resource_catalog:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-kube-prometheus-prometheus.kube-system.svc.cluster.local:9090
            - name: HAMI_COUNT_RESOURCE
              value: nvidia.com/gpu
            - name: HAMI_MEMORY_RESOURCE
              value: nvidia.com/gpumem
            - name: HAMI_CORE_RESOURCE
              value: nvidia.com/gpucores
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: resource-catalog
  namespace: science-ai-system
  labels:
    release: prometheus
    science-ai.io/managed-by: mini-science-ai-os
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: resource-catalog
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
