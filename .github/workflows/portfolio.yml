name: portfolio-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Ensure ripgrep is available
        run: command -v rg || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - name: Install runtime and test dependencies
        run: python -m pip install --requirement requirements.txt --requirement requirements-dev.txt
      - name: Run product and portfolio tests
        run: make portfolio-check
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit --requirement requirements.txt
          python -m pip_audit --requirement requirements-dev.txt
