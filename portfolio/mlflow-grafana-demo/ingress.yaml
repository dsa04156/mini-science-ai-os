apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mlflow-internal-only
  namespace: science-ai-mlops
  labels:
    app.kubernetes.io/part-of: mlflow-functional-demo
    science-ai.io/managed-by: mini-science-ai-os
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.0/8
      - 192.168.0.0/24
      - 10.244.0.0/16
      - 10.254.0.0/16
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mlflow-rate-limit
  namespace: science-ai-mlops
  labels:
    app.kubernetes.io/part-of: mlflow-functional-demo
    science-ai.io/managed-by: mini-science-ai-os
spec:
  rateLimit:
    average: 60
    burst: 120
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mlflow-security-headers
  namespace: science-ai-mlops
  labels:
    app.kubernetes.io/part-of: mlflow-functional-demo
    science-ai.io/managed-by: mini-science-ai-os
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    customResponseHeaders:
      Permissions-Policy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlflow
  namespace: science-ai-mlops
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: mlflow-functional-demo
    science-ai.io/managed-by: mini-science-ai-os
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: science-ai-mlops-mlflow-internal-only@kubernetescrd,science-ai-mlops-mlflow-rate-limit@kubernetescrd,science-ai-mlops-mlflow-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: mlflow.192.168.0.56.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlflow
                port:
                  name: http
    - host: mlflow.10.254.192.217.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlflow
                port:
                  name: http
