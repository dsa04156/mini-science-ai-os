apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: science-job-api
  labels:
    science-ai.io/managed-by: mini-science-ai-os
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: science-job-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-runtime
  labels:
    science-ai.io/managed-by: mini-science-ai-os
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: science-workspace-internal-only
  labels:
    science-ai.io/managed-by: mini-science-ai-os
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24
      - 10.244.0.0/16
      - 127.0.0.0/8
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: science-workspace-rate-limit
  labels:
    science-ai.io/managed-by: mini-science-ai-os
spec:
  rateLimit:
    average: 30
    burst: 60
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: science-workspace-headers
  labels:
    science-ai.io/managed-by: mini-science-ai-os
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: science-workspace
  labels:
    science-ai.io/managed-by: mini-science-ai-os
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: tenant-etri-science-workspace-internal-only@kubernetescrd,tenant-etri-science-workspace-rate-limit@kubernetescrd,tenant-etri-science-workspace-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: science-workspace.192.168.0.56.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: science-job-api
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: science-workspace-traefik-ingress
  labels:
    science-ai.io/managed-by: mini-science-ai-os
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: science-job-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8000
