apiVersion: batch/v1
kind: Job
metadata:
  name: kubeflow-minio-init
  labels:
    science-ai.io/managed-by: mini-science-ai-os
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeflow-minio-init
        science-ai.io/managed-by: mini-science-ai-os
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        environment: cloud
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: quay.io/minio/mc:RELEASE.2023-10-24T21-42-22Z
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mc alias set local http://seaweedfs:9000 "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"
              mc mb --ignore-existing local/kubeflow-pipelines
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeflow-artifact-store
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeflow-artifact-store
                  key: secretkey
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
