apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlops-default-deny
  namespace: science-ai-mlops
  labels:
    science-ai.io/managed-by: mini-science-ai-os
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-ingress-from-kubeflow
  namespace: science-ai-mlops
  labels:
    science-ai.io/managed-by: mini-science-ai-os
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubeflow
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlops-dns-egress
  namespace: science-ai-mlops
  labels:
    science-ai.io/managed-by: mini-science-ai-os
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
