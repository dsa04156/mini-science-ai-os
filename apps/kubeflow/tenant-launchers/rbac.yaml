apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner-etri
  namespace: kubeflow
  labels:
    science-ai.io/managed-by: mini-science-ai-os
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-etri-kubeflow
  namespace: kubeflow
  labels:
    science-ai.io/managed-by: mini-science-ai-os
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-runner
subjects:
  - kind: ServiceAccount
    name: pipeline-runner-etri
    namespace: kubeflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeflow-science-job-launcher
  namespace: tenant-etri
  labels:
    science-ai.io/managed-by: mini-science-ai-os
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads", "localqueues"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeflow-science-job-launcher
  namespace: tenant-etri
  labels:
    science-ai.io/managed-by: mini-science-ai-os
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeflow-science-job-launcher
subjects:
  - kind: ServiceAccount
    name: pipeline-runner-etri
    namespace: kubeflow
