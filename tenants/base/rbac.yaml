apiVersion: v1
kind: ServiceAccount
metadata:
  name: science-job-api
  labels:
    science-ai.io/managed-by: mini-science-ai-os
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: science-job-runner
  labels:
    science-ai.io/managed-by: mini-science-ai-os
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runtime
  labels:
    science-ai.io/managed-by: mini-science-ai-os
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: science-job-api
  labels:
    science-ai.io/managed-by: mini-science-ai-os
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads", "localqueues"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: science-job-api
  labels:
    science-ai.io/managed-by: mini-science-ai-os
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: science-job-api
subjects:
  - kind: ServiceAccount
    name: science-job-api
