apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-science-ai-os-ko-site
  namespace: science-ai-system
  labels:
    app.kubernetes.io/name: mini-science-ai-os-ko-site
    app.kubernetes.io/part-of: mini-science-ai-os
    science-ai.io/managed-by: mini-science-ai-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mini-science-ai-os-ko-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mini-science-ai-os-ko-site
        app.kubernetes.io/part-of: mini-science-ai-os
        science-ai.io/managed-by: mini-science-ai-os
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        environment: cloud
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: 192.168.0.56:5000/mini-science-ai-os:0.3.1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0", "--directory", "/site"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: site
              mountPath: /site
              readOnly: true
      volumes:
        - name: site
          configMap:
            name: mini-science-ai-os-ko-site
---
apiVersion: v1
kind: Service
metadata:
  name: mini-science-ai-os-ko-site
  namespace: science-ai-system
  labels:
    app.kubernetes.io/name: mini-science-ai-os-ko-site
    app.kubernetes.io/part-of: mini-science-ai-os
    science-ai.io/managed-by: mini-science-ai-os
spec:
  selector:
    app.kubernetes.io/name: mini-science-ai-os-ko-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mini-science-ai-os-ko-site
  namespace: science-ai-system
  labels:
    app.kubernetes.io/name: mini-science-ai-os-ko-site
    app.kubernetes.io/part-of: mini-science-ai-os
    science-ai.io/managed-by: mini-science-ai-os
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: mini-science-ai-os.192.168.0.56.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mini-science-ai-os-ko-site
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mini-science-ai-os-ko-site-ingress
  namespace: science-ai-system
  labels:
    app.kubernetes.io/name: mini-science-ai-os-ko-site
    app.kubernetes.io/part-of: mini-science-ai-os
    science-ai.io/managed-by: mini-science-ai-os
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mini-science-ai-os-ko-site
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: science-ai-system
      ports:
        - protocol: TCP
          port: 8080
